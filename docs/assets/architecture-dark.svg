<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Code the model writes runs in an untrusted box; keys, rules, approvals and the log stay in the trusted harness; the box has no route to the outside world">
  <title>Where each rule acts</title>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <defs><marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9198a1"/></marker></defs><rect x="530.0" y="34" width="140" height="44" rx="22" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="600.0" y="62" font-size="18" font-weight="700" text-anchor="middle" fill="#f0f6fc">You</text><path d="M600.0 80 V148" stroke="#9198a1" stroke-width="1.6" fill="none" marker-start="url(#a-dark)" marker-end="url(#a-dark)"/><circle cx="630.0" cy="114" r="12" fill="#12261e" stroke="#3fb981" stroke-width="1.5"/><text x="630.0" y="119" font-size="14" font-weight="700" text-anchor="middle" fill="#3fb981">4</text><text x="652.0" y="119.5" font-size="15.5" fill="#9198a1">approve the exact action, once</text><rect x="40" y="150" width="320" height="290" rx="14" fill="#151b23" stroke="#3fb981" stroke-width="2"/><text x="64" y="192" font-size="22" font-weight="700" fill="#f0f6fc">The box</text><rect x="246" y="172" width="90" height="26" rx="13" fill="none" stroke="#3fb981" stroke-width="1.3"/><text x="291" y="190" font-size="13.5" text-anchor="middle" fill="#3fb981">untrusted</text><text x="64" y="220" font-size="16" fill="#9198a1">Code the model writes</text><circle cx="76" cy="254" r="12" fill="#12261e" stroke="#3fb981" stroke-width="1.5"/><text x="76" y="259" font-size="14" font-weight="700" text-anchor="middle" fill="#3fb981">1</text><text x="98" y="260" font-size="17" fill="#f0f6fc">No network, one folder</text><circle cx="76" cy="290" r="12" fill="#12261e" stroke="#3fb981" stroke-width="1.5"/><text x="76" y="295" font-size="14" font-weight="700" text-anchor="middle" fill="#3fb981">2</text><text x="98" y="296" font-size="17" fill="#f0f6fc">No keys inside</text><circle cx="76" cy="326" r="12" fill="#12261e" stroke="#3fb981" stroke-width="1.5"/><text x="76" y="331" font-size="14" font-weight="700" text-anchor="middle" fill="#3fb981">3</text><text x="98" y="332" font-size="17" fill="#f0f6fc">Proven before first run</text><line x1="64" y1="390" x2="336" y2="390" stroke="#3d444d"/><text x="64" y="418" font-size="14.5" fill="#9198a1">Seatbelt on macOS · bubblewrap on Linux</text><rect x="440" y="150" width="320" height="290" rx="14" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="464" y="192" font-size="22" font-weight="700" fill="#f0f6fc">The harness</text><rect x="663" y="172" width="73" height="26" rx="13" fill="none" stroke="#3d444d" stroke-width="1.3"/><text x="699" y="190" font-size="13.5" text-anchor="middle" fill="#9198a1">trusted</text><text x="464" y="220" font-size="16" fill="#9198a1">Your agent's own process</text><circle cx="476" cy="254" r="12" fill="#12261e" stroke="#3fb981" stroke-width="1.5"/><text x="476" y="259" font-size="14" font-weight="700" text-anchor="middle" fill="#3fb981">2</text><text x="498" y="260" font-size="17" fill="#f0f6fc">Keys only to named hosts</text><circle cx="476" cy="290" r="12" fill="#12261e" stroke="#3fb981" stroke-width="1.5"/><text x="476" y="295" font-size="14" font-weight="700" text-anchor="middle" fill="#3fb981">4</text><text x="498" y="296" font-size="17" fill="#f0f6fc">Asks before it acts</text><circle cx="476" cy="326" r="12" fill="#12261e" stroke="#3fb981" stroke-width="1.5"/><text x="476" y="331" font-size="14" font-weight="700" text-anchor="middle" fill="#3fb981">5</text><text x="498" y="332" font-size="17" fill="#f0f6fc">One rules file, reviewed</text><circle cx="476" cy="362" r="12" fill="#12261e" stroke="#3fb981" stroke-width="1.5"/><text x="476" y="367" font-size="14" font-weight="700" text-anchor="middle" fill="#3fb981">6</text><text x="498" y="368" font-size="17" fill="#f0f6fc">Hash-chained log</text><line x1="464" y1="390" x2="736" y2="390" stroke="#3d444d"/><text x="464" y="418" font-size="14.5" fill="#9198a1">Reads output through pipes</text><rect x="840" y="150" width="320" height="290" rx="14" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="864" y="192" font-size="22" font-weight="700" fill="#f0f6fc">Outside</text><text x="864" y="220" font-size="16" fill="#9198a1">Model APIs, mail, the web</text><circle cx="876" cy="254" r="12" fill="#12261e" stroke="#3fb981" stroke-width="1.5"/><text x="876" y="259" font-size="14" font-weight="700" text-anchor="middle" fill="#3fb981">1</text><text x="898" y="260" font-size="17" fill="#f0f6fc">Named hosts only</text><line x1="864" y1="390" x2="1136" y2="390" stroke="#3d444d"/><text x="864" y="418" font-size="14.5" fill="#9198a1">Reached only through the harness</text><path d="M364 278 H436" stroke="#9198a1" stroke-width="1.6" fill="none" marker-start="url(#a-dark)" marker-end="url(#a-dark)"/><text x="400.0" y="264" font-size="14" text-anchor="middle" fill="#9198a1">run</text><text x="400.0" y="304" font-size="14" text-anchor="middle" fill="#9198a1">output</text><path d="M764 278 H836" stroke="#9198a1" stroke-width="1.6" fill="none" marker-end="url(#a-dark)"/><text x="800.0" y="264" font-size="14" text-anchor="middle" fill="#9198a1">calls</text><text x="800.0" y="304" font-size="14" text-anchor="middle" fill="#9198a1">+ key</text><path d="M200.0 442 C200.0 560, 1000.0 560, 1000.0 442" stroke="#f85149" stroke-width="1.8" stroke-dasharray="7 7" fill="none"/><rect x="350.0" y="518" width="500" height="34" rx="17" fill="#0d1117"/><text x="600.0" y="541" font-size="15.5" text-anchor="middle" fill="#f85149">no route: code in the box reaches nothing but the harness</text>
  </g>
</svg>
