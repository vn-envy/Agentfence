<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Code the model writes runs in an untrusted box; keys, rules, approvals and the log stay in the trusted harness; the box has no route to the outside world">
  <title>Where each rule acts</title>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <defs><marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#59636e"/></marker></defs><rect x="530.0" y="34" width="140" height="44" rx="22" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="600.0" y="62" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2328">You</text><path d="M600.0 80 V148" stroke="#59636e" stroke-width="1.6" fill="none" marker-start="url(#a-light)" marker-end="url(#a-light)"/><circle cx="630.0" cy="114" r="12" fill="#dafbe1" stroke="#1a7f5a" stroke-width="1.5"/><text x="630.0" y="119" font-size="14" font-weight="700" text-anchor="middle" fill="#1a7f5a">4</text><text x="652.0" y="119.5" font-size="15.5" fill="#59636e">approve the exact action, once</text><rect x="40" y="150" width="320" height="290" rx="14" fill="#f6f8fa" stroke="#1a7f5a" stroke-width="2"/><text x="64" y="192" font-size="22" font-weight="700" fill="#1f2328">The box</text><rect x="246" y="172" width="90" height="26" rx="13" fill="none" stroke="#1a7f5a" stroke-width="1.3"/><text x="291" y="190" font-size="13.5" text-anchor="middle" fill="#1a7f5a">untrusted</text><text x="64" y="220" font-size="16" fill="#59636e">Code the model writes</text><circle cx="76" cy="254" r="12" fill="#dafbe1" stroke="#1a7f5a" stroke-width="1.5"/><text x="76" y="259" font-size="14" font-weight="700" text-anchor="middle" fill="#1a7f5a">1</text><text x="98" y="260" font-size="17" fill="#1f2328">No network, one folder</text><circle cx="76" cy="290" r="12" fill="#dafbe1" stroke="#1a7f5a" stroke-width="1.5"/><text x="76" y="295" font-size="14" font-weight="700" text-anchor="middle" fill="#1a7f5a">2</text><text x="98" y="296" font-size="17" fill="#1f2328">No keys inside</text><circle cx="76" cy="326" r="12" fill="#dafbe1" stroke="#1a7f5a" stroke-width="1.5"/><text x="76" y="331" font-size="14" font-weight="700" text-anchor="middle" fill="#1a7f5a">3</text><text x="98" y="332" font-size="17" fill="#1f2328">Proven before first run</text><line x1="64" y1="390" x2="336" y2="390" stroke="#d1d9e0"/><text x="64" y="418" font-size="14.5" fill="#59636e">Seatbelt on macOS · bubblewrap on Linux</text><rect x="440" y="150" width="320" height="290" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="464" y="192" font-size="22" font-weight="700" fill="#1f2328">The harness</text><rect x="663" y="172" width="73" height="26" rx="13" fill="none" stroke="#d1d9e0" stroke-width="1.3"/><text x="699" y="190" font-size="13.5" text-anchor="middle" fill="#59636e">trusted</text><text x="464" y="220" font-size="16" fill="#59636e">Your agent's own process</text><circle cx="476" cy="254" r="12" fill="#dafbe1" stroke="#1a7f5a" stroke-width="1.5"/><text x="476" y="259" font-size="14" font-weight="700" text-anchor="middle" fill="#1a7f5a">2</text><text x="498" y="260" font-size="17" fill="#1f2328">Keys only to named hosts</text><circle cx="476" cy="290" r="12" fill="#dafbe1" stroke="#1a7f5a" stroke-width="1.5"/><text x="476" y="295" font-size="14" font-weight="700" text-anchor="middle" fill="#1a7f5a">4</text><text x="498" y="296" font-size="17" fill="#1f2328">Asks before it acts</text><circle cx="476" cy="326" r="12" fill="#dafbe1" stroke="#1a7f5a" stroke-width="1.5"/><text x="476" y="331" font-size="14" font-weight="700" text-anchor="middle" fill="#1a7f5a">5</text><text x="498" y="332" font-size="17" fill="#1f2328">One rules file, reviewed</text><circle cx="476" cy="362" r="12" fill="#dafbe1" stroke="#1a7f5a" stroke-width="1.5"/><text x="476" y="367" font-size="14" font-weight="700" text-anchor="middle" fill="#1a7f5a">6</text><text x="498" y="368" font-size="17" fill="#1f2328">Hash-chained log</text><line x1="464" y1="390" x2="736" y2="390" stroke="#d1d9e0"/><text x="464" y="418" font-size="14.5" fill="#59636e">Reads output through pipes</text><rect x="840" y="150" width="320" height="290" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="864" y="192" font-size="22" font-weight="700" fill="#1f2328">Outside</text><text x="864" y="220" font-size="16" fill="#59636e">Model APIs, mail, the web</text><circle cx="876" cy="254" r="12" fill="#dafbe1" stroke="#1a7f5a" stroke-width="1.5"/><text x="876" y="259" font-size="14" font-weight="700" text-anchor="middle" fill="#1a7f5a">1</text><text x="898" y="260" font-size="17" fill="#1f2328">Named hosts only</text><line x1="864" y1="390" x2="1136" y2="390" stroke="#d1d9e0"/><text x="864" y="418" font-size="14.5" fill="#59636e">Reached only through the harness</text><path d="M364 278 H436" stroke="#59636e" stroke-width="1.6" fill="none" marker-start="url(#a-light)" marker-end="url(#a-light)"/><text x="400.0" y="264" font-size="14" text-anchor="middle" fill="#59636e">run</text><text x="400.0" y="304" font-size="14" text-anchor="middle" fill="#59636e">output</text><path d="M764 278 H836" stroke="#59636e" stroke-width="1.6" fill="none" marker-end="url(#a-light)"/><text x="800.0" y="264" font-size="14" text-anchor="middle" fill="#59636e">calls</text><text x="800.0" y="304" font-size="14" text-anchor="middle" fill="#59636e">+ key</text><path d="M200.0 442 C200.0 560, 1000.0 560, 1000.0 442" stroke="#cf222e" stroke-width="1.8" stroke-dasharray="7 7" fill="none"/><rect x="350.0" y="518" width="500" height="34" rx="17" fill="#ffffff"/><text x="600.0" y="541" font-size="15.5" text-anchor="middle" fill="#cf222e">no route: code in the box reaches nothing but the harness</text>
  </g>
</svg>
