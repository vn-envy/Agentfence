name: Release

# Push a tag like v0.1.0: the tests run on the real sandbox, the package is
# built, and a GitHub release is published with docs/releases/<tag>.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: The tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package $version"; exit 1; }
          test -f "docs/releases/$GITHUB_REF_NAME.md" || { echo "missing docs/releases/$GITHUB_REF_NAME.md"; exit 1; }

      - name: Test
        run: |
          pip install -e ".[test]"
          agentfence check
          pytest -q

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "agentfence $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
